<?xml version="1.0" encoding="UTF-8"?>
<!--
  Joker for the "flat" deck, drawn to match "Poker playing cards" by
  macrovector / Freepik (palette, outline, corner index and court-card frame).
  Original artwork for this project. Units: 10x the source points; the viewBox
  is the card's outer box including its outline, like the extracted faces.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="409.3" height="622.9" viewBox="0 0 409.3 622.9">
  <defs>
    <!-- Monoline letters in the style of the deck's corner indices (24 x 40 box). -->
    <path id="L-J" d="M18.5 3V27.5C18.5 33.5 15.4 37 10.4 37C5.6 37 2.9 34 2.4 29.2"/>
    <ellipse id="L-O" cx="12" cy="20" rx="10" ry="17"/>
    <path id="L-K" d="M3.5 3V37M21 3L3.5 23.2M9.6 16.2L21.5 37"/>
    <path id="L-E" d="M20.5 3H3.5V37H20.5M3.5 19.6H18.6"/>
    <path id="L-R" d="M3.5 37V3H12.2C18 3 20.8 6.3 20.8 11.4C20.8 16.6 18 19.9 12.2 19.9H3.5M12.4 19.9L21.2 37"/>
    <path id="star" d="M0 -16L4.2 -5.4L15.2 -4.9L6.7 2.2L9.4 13L0 7L-9.4 13L-6.7 2.2L-15.2 -4.9L-4.2 -5.4Z"/>
    <!-- "JOKER" written down the corner, then a star where a suit pip would be. -->
    <g id="index">
      <g fill="none" stroke="#0c0a35" stroke-width="4.8" stroke-linejoin="miter" stroke-linecap="butt">
        <use xlink:href="#L-J" transform="translate(40.6 30) scale(0.95)"/>
        <use xlink:href="#L-O" transform="translate(40.6 76) scale(0.95)"/>
        <use xlink:href="#L-K" transform="translate(40.6 122) scale(0.95)"/>
        <use xlink:href="#L-E" transform="translate(40.6 168) scale(0.95)"/>
        <use xlink:href="#L-R" transform="translate(40.6 214) scale(0.95)"/>
      </g>
      <use xlink:href="#star" transform="translate(52 278)" fill="#d6002b"/>
    </g>
    <clipPath id="face-clip">
      <ellipse cx="204.65" cy="322" rx="60" ry="70"/>
    </clipPath>
    <pattern id="harlequin" patternUnits="userSpaceOnUse" x="164.65" y="448" width="80" height="64">
      <rect width="80" height="64" fill="#0c0a35"/>
      <path d="M40 0L80 32L40 64L0 32Z" fill="#d6002b"/>
      <path d="M40 11L66.3 32L40 53L13.7 32Z" fill="#b70027"/>
      <g fill="#fff">
        <circle cx="0" cy="0" r="3.2"/>
        <circle cx="80" cy="0" r="3.2"/>
        <circle cx="0" cy="64" r="3.2"/>
        <circle cx="80" cy="64" r="3.2"/>
        <circle cx="40" cy="32" r="3.2"/>
      </g>
    </pattern>
  </defs>

  <!-- Card -->
  <rect x="0.94" y="0.94" width="407.42" height="621.02" rx="34.49" fill="#fff" stroke="#2d2d2d" stroke-width="1.88"/>

  <!-- Court-card style frame, open around the corner indices (point-symmetric) -->
  <g fill="none" stroke="#0c0a35" stroke-width="1.6">
    <path d="M86 32H357.3Q377.3 32 377.3 52V302.9"/>
    <path d="M323.3 590.9H52Q32 590.9 32 570.9V320"/>
  </g>

  <!-- Harlequin tunic -->
  <path d="M84 590.9C84 522 104 470 150 448H259.3C305.3 470 325.3 522 325.3 590.9Z" fill="url(#harlequin)"/>

  <!-- Ruff collar -->
  <path d="M118 420L138 470L158 432L180 476L204.65 436L229.3 476L251.3 432L271.3 470L291.3 420Z" fill="#d6002b"/>
  <g fill="#fff">
    <circle cx="138" cy="470" r="4.4"/>
    <circle cx="180" cy="476" r="4.4"/>
    <circle cx="229.3" cy="476" r="4.4"/>
    <circle cx="271.3" cy="470" r="4.4"/>
  </g>
  <path d="M146 398Q204.65 430 263.3 398L266 422Q204.65 456 143.3 422Z" fill="#22226f"/>

  <!-- Face -->
  <ellipse cx="204.65" cy="322" rx="60" ry="70" fill="#ffd6a1"/>
  <g clip-path="url(#face-clip)">
    <ellipse cx="204.65" cy="404" rx="70" ry="18" fill="#f2b98a"/>
  </g>
  <g fill="none" stroke="#0c0a35" stroke-width="3" stroke-linecap="round">
    <path d="M162 302Q177 292 192 299M217.3 299Q232.3 292 247.3 302"/>
  </g>
  <path d="M161 320Q177 306 193 320Q177 332 161 320Z" fill="#fff" stroke="#0c0a35" stroke-width="2.4"/>
  <circle cx="177" cy="320" r="5.4" fill="#0c0a35"/>
  <path d="M216.3 320Q232.3 306 248.3 320Q232.3 332 216.3 320Z" fill="#fff" stroke="#0c0a35" stroke-width="2.4"/>
  <circle cx="232.3" cy="320" r="5.4" fill="#0c0a35"/>
  <circle cx="162" cy="350" r="11" fill="#d6002b"/>
  <circle cx="247.3" cy="350" r="11" fill="#d6002b"/>
  <path d="M207 324Q196 343 209 347" fill="none" stroke="#0c0a35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 364Q204.65 392 231.3 364Q204.65 377 178 364Z" fill="#b70027"/>

  <!-- Hat: three floppy points with bells -->
  <path d="M150 290C138 256 124 226 106 204C138 206 172 238 190 290Z" fill="#d6002b"/>
  <path d="M106 204C138 206 172 238 190 290H173C162 252 138 222 106 204Z" fill="#b70027"/>
  <path d="M259.3 290C271.3 256 285.3 226 303.3 204C271.3 206 237.3 238 219.3 290Z" fill="#d6002b"/>
  <path d="M303.3 204C271.3 206 237.3 238 219.3 290H236.3C247.3 252 271.3 222 303.3 204Z" fill="#b70027"/>
  <path d="M166 290C160 220 176 160 204.65 112C233.3 160 249.3 220 243.3 290Z" fill="#0c0a35"/>
  <path d="M204.65 112C190 164 186 226 190 290H219.3C223.3 226 219.3 164 204.65 112Z" fill="#22226f"/>
  <path d="M140 270Q204.65 254 269.3 270L271.3 296Q204.65 280 138 296Z" fill="#b70027"/>
  <g fill="#fff">
    <circle cx="160" cy="279" r="4"/>
    <circle cx="182" cy="274.5" r="4"/>
    <circle cx="204.65" cy="273" r="4"/>
    <circle cx="227.3" cy="274.5" r="4"/>
    <circle cx="249.3" cy="279" r="4"/>
  </g>
  <g fill="#fff" stroke="#0c0a35" stroke-width="2.6">
    <circle cx="106" cy="204" r="14"/>
    <circle cx="204.65" cy="104" r="14"/>
    <circle cx="303.3" cy="204" r="14"/>
  </g>
  <g fill="#d6002b">
    <circle cx="106" cy="204" r="5"/>
    <circle cx="204.65" cy="104" r="5"/>
    <circle cx="303.3" cy="204" r="5"/>
  </g>

  <!-- Corner indices -->
  <use xlink:href="#index"/>
  <use xlink:href="#index" transform="rotate(180 204.65 311.45)"/>
</svg>
